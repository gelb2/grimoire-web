# CI 파이프라인 — PR + 푸시 시 타입 체크 + 테스트 + 빌드 검증
# develop/inhouse/main 브랜치 푸시 및 develop 대상 PR에서 실행

name: CI

on:
  push:
    branches: [develop, inhouse, main]
  pull_request:
    branches: [develop]

# 동일 PR/브랜치에 새 커밋이 푸시되면 이전 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 환경 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 의존성 설치
      - name: Install dependencies
        run: npm ci

      # TypeScript 타입 체크 (컴파일 없이 타입만 검증)
      - name: TypeScript type check
        run: npx tsc --noEmit

      # 린트 검사
      - name: Lint
        run: npm run lint

      # 유닛 테스트 실행
      - name: Run tests
        run: npm test

      # Next.js 프로덕션 빌드 (BFF 패턴: 더미 API_URL로 빌드 통과)
      - name: Build
        run: npm run build
        env:
          API_URL: http://localhost:3000/api

      # E2E 테스트는 CI에서 제외 — 백엔드 서버가 없어 타임아웃 발생
      # inhouse 환경에서 실제 서버 대상으로 수동 실행
      # - name: E2E tests
      #   run: npm run test:e2e

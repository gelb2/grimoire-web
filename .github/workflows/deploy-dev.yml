# 개발 환경 배포 — develop 브랜치 푸시 시 자동 실행
# BFF 패턴: Docker 이미지 1개, API_URL은 런타임 환경변수로 주입

name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

# 동시 배포 방지
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: development

    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Azure CLI 로그인
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ACR 로그인
      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: grimoireacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Docker 이미지 빌드 (API URL 불필요 — 런타임 환경변수로 주입)
      - name: Build and push Docker image
        run: |
          IMAGE=grimoireacr.azurecr.io/grimoire-web
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_APP_ENV=development \
            -t $IMAGE:dev-${{ github.sha }} \
            -t $IMAGE:dev-latest \
            .
          docker push $IMAGE:dev-${{ github.sha }}
          docker push $IMAGE:dev-latest

      # Azure Container Apps 업데이트
      # API_URL은 Container Apps 환경변수로 설정 (Azure Portal 또는 az cli)
      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name grimoire-web-dev \
            --resource-group grimoire-rg \
            --image grimoireacr.azurecr.io/grimoire-web:dev-${{ github.sha }} \
            -o none

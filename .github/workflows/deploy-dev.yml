name: Deploy Development

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_ENV=development \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.DEV_API_URL }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/grimoire-web:dev-${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/grimoire-web:dev-latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/grimoire-web:dev-${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/grimoire-web:dev-latest

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: grimoire-rg
          containerAppName: grimoire-web-dev
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/grimoire-web:dev-${{ github.sha }}

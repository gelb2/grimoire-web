# 인하우스 환경 배포 — inhouse 브랜치 푸시 시 자동 실행
# BFF 패턴: Docker 이미지 1개, API_URL은 런타임 환경변수로 주입

name: Deploy Inhouse

on:
  push:
    branches: [inhouse]
  workflow_dispatch:

# 동시 배포 방지
concurrency:
  group: deploy-inhouse
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Inhouse
    runs-on: ubuntu-latest
    environment: inhouse

    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Azure CLI 로그인
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ACR 로그인
      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: grimoireacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Docker 이미지 빌드 (API URL 불필요 — 런타임 환경변수로 주입)
      - name: Build and push Docker image
        run: |
          IMAGE=grimoireacr.azurecr.io/grimoire-web
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_APP_ENV=inhouse \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY=6Ldxb6QsAAAAABTyABs61_Bzhi6iwrAQiqRbbXaJ \
            -t $IMAGE:inhouse-${{ github.sha }} \
            -t $IMAGE:inhouse-latest \
            .
          docker push $IMAGE:inhouse-${{ github.sha }}
          docker push $IMAGE:inhouse-latest

      # Azure Container Apps 업데이트
      # API_URL은 Container Apps 환경변수로 설정 (Azure Portal 또는 az cli)
      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name grimoire-web-inhouse \
            --resource-group zenith-rg \
            --image grimoireacr.azurecr.io/grimoire-web:inhouse-${{ github.sha }} \
            -o none

      - name: Purge old images
        run: |
          TAGS=$(az acr repository show-tags --name grimoireacr --repository grimoire-web --orderby time_asc --query "[?starts_with(@, 'inhouse-')]" -o tsv)
          TOTAL=$(echo "$TAGS" | wc -l)
          DELETE=$((TOTAL - 5))
          if [ "$DELETE" -gt 0 ]; then
            echo "$TAGS" | head -n $DELETE | while read TAG; do
              az acr repository delete --name grimoireacr --image "grimoire-web:$TAG" --yes 2>/dev/null || true
            done
          fi
